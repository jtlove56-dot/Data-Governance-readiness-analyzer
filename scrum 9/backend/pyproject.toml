[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "karlsgate-api"
version = "0.1.0"
description = "FastAPI service foundation for Karlsgate."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.141,<0.142",
  "typing-extensions>=4.16,<5",
  "uvicorn[standard]>=0.30,<0.31"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<0.28",
  "mypy>=1.17,<1.18",
  "pytest>=8.3,<8.4",
  "ruff>=0.12,<0.13"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["app"]
