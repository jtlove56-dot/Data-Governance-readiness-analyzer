name: SCRUM-9 questionnaire checks

on:
  pull_request:
    paths:
      - 'scrum 9/**'
      - '.github/workflows/scrum-9.yml'
  push:
    branches: [main, scrum-9-questionnaire]
    paths:
      - 'scrum 9/**'
      - '.github/workflows/scrum-9.yml'

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'scrum 9'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm --filter @karlsgate/frontend build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 'scrum 9/backend'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: mypy app
      - run: pytest
